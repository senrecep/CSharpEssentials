name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v4.2.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v4.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Verify version alignment
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PROP_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)

          echo "Tag version:    $TAG_VERSION"
          echo "Props version:  $PROP_VERSION"

          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Version mismatch! Tag is v$TAG_VERSION but Directory.Build.props has $PROP_VERSION"
            exit 1
          fi

          echo "Versions aligned."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Make script executable
        run: chmod +x ./build-and-publish-nugets.sh

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: recepsen

      - name: Publish to NuGet
        run: ./build-and-publish-nugets.sh --parallel ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols
