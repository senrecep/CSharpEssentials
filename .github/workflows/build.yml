name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Examples stay out of CSharpEssentials.slnx; CI builds the ones that need guarding explicitly.
      - name: Build Enums end-to-end example
        run: dotnet build examples/Examples.Enums.EndToEnd/Examples.Enums.EndToEnd.csproj --configuration Release -warnaserror

      # A package consumer that references any single CSharpEssentials package that depends on Enums (Json,
      # EntityFrameworkCore, AspNetCore two hops away, AspNetCore.OpenApi, Validation through Results, Mediator)
      # must get the Enums generator: tests/PackageConsumer fails at run time when [StringEnum] metadata is missing.
      - name: Pack to a local feed
        run: |
          dotnet build CSharpEssentials.slnx --no-restore --configuration Release -p:Version=0.0.0-ci.${{ github.run_id }}
          dotnet pack CSharpEssentials.slnx --no-build --configuration Release -o artifacts/feed -p:Version=0.0.0-ci.${{ github.run_id }}

      - name: Run package consumers
        run: |
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.Json -p:CseVersion=0.0.0-ci.${{ github.run_id }}
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.EntityFrameworkCore -p:CseVersion=0.0.0-ci.${{ github.run_id }}
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.AspNetCore -p:CseVersion=0.0.0-ci.${{ github.run_id }}
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.AspNetCore.OpenApi -p:CseVersion=0.0.0-ci.${{ github.run_id }}
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.Validation -p:CseVersion=0.0.0-ci.${{ github.run_id }}
          dotnet run --project tests/PackageConsumer --configuration Release -p:CsePackage=CSharpEssentials.Mediator -p:CseVersion=0.0.0-ci.${{ github.run_id }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage

  aot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT example
        run: dotnet publish examples/Examples.Endpoints/Examples.Endpoints.csproj --configuration Release --runtime linux-x64 -warnaserror
